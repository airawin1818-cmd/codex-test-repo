<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --panel:#111827; --grid:#1f2937; --snake:#22c55e; --food:#f43f5e; --text:#e5e7eb; --muted:#9ca3af; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:var(--text); font-family:Segoe UI, sans-serif; }
    .game-wrap { width:min(92vw,560px); padding:16px; background:var(--panel); border:1px solid #334155; border-radius:12px; }
    .hud { display:flex; justify-content:space-between; margin-bottom:10px; }
    .board { position:relative; }
    canvas { width:100%; aspect-ratio:1/1; display:block; background:var(--bg); border:1px solid #334155; border-radius:8px; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
    .overlay span { background:rgba(2,6,23,.8); border:1px solid #475569; border-radius:8px; padding:8px 12px; font-size:.95rem; }
    .controls,.touch { margin-top:10px; color:var(--muted); font-size:.9rem; text-align:center; }
    .touch { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:240px; margin-inline:auto; }
    .touch button { background:#0b1220; color:var(--text); border:1px solid #475569; border-radius:6px; padding:8px 0; font-size:1rem; }
  </style>
</head>
<body>
  <main class="game-wrap">
    <div class="hud"><div>Score: <strong id="score">0</strong></div><div>Best: <strong id="best">0</strong></div></div>
    <div class="board">
      <canvas id="game" width="480" height="480" aria-label="Snake board"></canvas>
      <div class="overlay" id="overlay"><span>Press arrows/WASD to start</span></div>
    </div>
    <div class="controls">Arrows/WASD move, Space pause, R restart.</div>
    <div class="touch" aria-label="Touch controls">
      <div></div><button data-dir="up">↑</button><div></div>
      <button data-dir="left">←</button><button data-action="pause">⏯</button><button data-dir="right">→</button>
      <div></div><button data-dir="down">↓</button><button data-action="restart">R</button>
    </div>
  </main>
<script>
(() => {
  const GRID_SIZE = 20, TILES = 24, BASE_TICK_MS = 140;
  const canvas = document.getElementById('game'); const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'); const bestEl = document.getElementById('best'); const overlay = document.getElementById('overlay');

  const DIR = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  const same = (a,b) => a.x===b.x && a.y===b.y;
  const opposite = (a,b) => a.x===-b.x && a.y===-b.y;
  function nextFood(snake, rng=Math.random) {
    const open=[]; for(let y=0;y<TILES;y++) for(let x=0;x<TILES;x++) if(!snake.some(s=>s.x===x&&s.y===y)) open.push({x,y});
    return open[Math.floor(rng()*open.length)] || {x:0,y:0};
  }
  function initialState(rng=Math.random) {
    const snake=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];
    return { snake, dir:DIR.right, nextDir:DIR.right, food:nextFood(snake,rng), score:0, started:false, paused:false, over:false };
  }
  function step(state, rng=Math.random) {
    if (!state.started || state.paused || state.over) return state;
    const dir = state.nextDir;
    const head = { x:state.snake[0].x+dir.x, y:state.snake[0].y+dir.y };
    const hitWall = head.x<0||head.y<0||head.x>=TILES||head.y>=TILES;
    const hitSelf = state.snake.some(seg => same(seg, head));
    if (hitWall || hitSelf) return { ...state, over:true, started:false };
    const grew = same(head, state.food); const snake=[head, ...state.snake]; if (!grew) snake.pop();
    return { ...state, dir, snake, score:state.score+(grew?1:0), food: grew ? nextFood(snake,rng) : state.food };
  }

  let best = Number(localStorage.getItem('snake_best')||0); bestEl.textContent = best;
  let state = initialState();

  function setOverlay(text, show=true){ overlay.hidden=!show; overlay.querySelector('span').textContent=text; }
  function draw(){
    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(148,163,184,.14)'; for(let i=0;i<=TILES;i++){const p=i*GRID_SIZE;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(canvas.width,p);ctx.stroke();}
    ctx.fillStyle='#f43f5e'; ctx.fillRect(state.food.x*GRID_SIZE+2,state.food.y*GRID_SIZE+2,GRID_SIZE-4,GRID_SIZE-4);
    state.snake.forEach((seg,i)=>{ctx.fillStyle=i===0?'#4ade80':'#22c55e';ctx.fillRect(seg.x*GRID_SIZE+1,seg.y*GRID_SIZE+1,GRID_SIZE-2,GRID_SIZE-2);});
  }
  function applyDirection(next){ if (opposite(state.dir,next)) return; if(!state.started){state={...state,started:true}; setOverlay('',false);} state={...state,nextDir:next}; }
  function restart(){ state = initialState(); scoreEl.textContent='0'; setOverlay('Press arrows/WASD to start', true); draw(); }

  setInterval(() => {
    state = step(state);
    scoreEl.textContent = String(state.score);
    if (state.score > best) { best = state.score; bestEl.textContent = String(best); localStorage.setItem('snake_best', String(best)); }
    if (state.over) setOverlay(`Game over. Score ${state.score}. Press R to restart.`, true);
    draw();
  }, BASE_TICK_MS);

  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(key)) e.preventDefault();
    if (key==='arrowup'||key==='w') applyDirection(DIR.up);
    else if (key==='arrowdown'||key==='s') applyDirection(DIR.down);
    else if (key==='arrowleft'||key==='a') applyDirection(DIR.left);
    else if (key==='arrowright'||key==='d') applyDirection(DIR.right);
    else if (key===' ') { if (!state.over) { const paused=!state.paused; state={...state,paused}; if (paused) setOverlay('Paused. Press Space to continue.', true); else setOverlay('', false); } }
    else if (key==='r') restart();
  });

  document.querySelector('.touch').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    const dir = btn.dataset.dir; const action = btn.dataset.action;
    if (dir) applyDirection(DIR[dir]);
    if (action==='pause' && !state.over) { const paused=!state.paused; state={...state,paused}; if (paused) setOverlay('Paused. Press Space to continue.', true); else setOverlay('', false); }
    if (action==='restart') restart();
  });

  draw();
})();
</script>
</body>
</html>
